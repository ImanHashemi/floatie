name: Secrets
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/floatie-gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/floatie-gitleaks-bin" gitleaks
          printf '%s\n' "$RUNNER_TEMP/floatie-gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan all fetched Git history with redacted output
        shell: bash
        run: gitleaks git --redact --log-opts='--all'
